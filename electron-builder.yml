appId: com.raredead.filtr
productName: FILTR
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: resources/covers
    to: covers
asarUnpack:
  - resources/**
  - node_modules/ffmpeg-static/**
win:
  executableName: filtr
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSDocumentsFolderUsageDescription: FILTR reads audio files from folders you choose.
    - NSDownloadsFolderUsageDescription: FILTR reads audio files from folders you choose.
  notarize: false
  artifactName: ${name}-${version}-${arch}-mac.${ext}
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: raredead
  category: AudioVideo
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
